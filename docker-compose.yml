services:
  mealbridge:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
      MEALBRIDGE_DATA_FILE: /app/data/store.json
    volumes:
      - mealbridge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  mealbridge-data:
